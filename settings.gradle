pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'KikuGie'; url = 'https://maven.kikugie.dev/releases' }
        maven { name = 'KikuGie Snapshots'; url = 'https://maven.kikugie.dev/snapshots' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'wfchat'

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        versions '1.20.1', '1.21.1'
        vers '26.1', '26.1.2'
        vers '1.20.1-fabric', '1.20.1'
        vers '1.21.1-fabric', '1.21.1'
        vers '26.1-fabric', '26.1.2'
        vcsVersion = '1.21.1'
    }
}
